name: Generate graphs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-graphs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Show repository structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Check graph script exists
        run: |
          if [ ! -f scripts/generate_graphs.py ]; then
            echo "ERROR: scripts/generate_graphs.py not found."
            echo "Your repo must contain scripts/generate_graphs.py at the root level."
            exit 2
          fi

      - name: Run graph generation script
        run: |
          python scripts/generate_graphs.py

      - name: List generated graphs
        run: |
          echo "Generated graph files:"
          find graphs -type f -maxdepth 1 -print || true

      - name: Commit generated graphs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add graphs/

          if git diff --cached --quiet; then
            echo "No graph changes to commit."
          else
            git commit -m "Generate graph outputs"
            git push
          fi
