name: Generate graphs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-graphs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Create graphs folder
        run: |
          mkdir -p graphs

      - name: Run graph generation script
        run: |
          python scripts/generate_graphs.py

      - name: List generated graphs
        run: |
          echo "Generated graph files:"
          find graphs -type f -maxdepth 1 -print

      - name: Commit generated graphs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add graphs/

          if git diff --cached --quiet; then
            echo "No graph changes to commit."
          else
            git commit -m "Generate graph outputs"
            git push
          fi
